services:
  db:
    image: postgres:18-alpine
    container_name: kiosk_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiosk}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - kiosk_network
    # Do NOT publish 5432 to the host in production packages.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: kiosk-backend:latest
    container_name: kiosk_backend
    env_file:
      - .env
    environment:
      # Compose ${...} interpolation strips Windows CRLF; env_file alone may keep \r
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiosk}
      PAYMENT_GATEWAY_NAME: ${PAYMENT_GATEWAY_NAME:-bridge}
      POS_USE_BRIDGE: ${POS_USE_BRIDGE:-True}
      POS_BRIDGE_HOST: ${POS_BRIDGE_HOST:-host.docker.internal}
      POS_BRIDGE_PORT: ${POS_BRIDGE_PORT:-9000}
      POS_TCP_HOST: ${POS_TCP_HOST:-192.168.1.100}
      POS_TCP_PORT: ${POS_TCP_PORT:-1362}
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - kiosk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: kiosk-frontend:latest
    container_name: kiosk_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api
      - INTERNAL_API_BASE_URL=http://backend:8000/api
    networks:
      - kiosk_network
    restart: unless-stopped
    depends_on:
      - backend

  bale_bot:
    image: kiosk-backend:latest
    container_name: kiosk_bale_bot
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiosk}
    command: python manage.py bale_poll
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - kiosk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Exit 0 when BALE_BOT_ENABLED=False — do not restart-loop
    restart: on-failure

  nginx:
    image: kiosk-nginx:latest
    container_name: kiosk_nginx
    ports:
      - "80:80"
    networks:
      - kiosk_network
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

networks:
  kiosk_network:
    driver: bridge

volumes:
  backend_media:
  backend_logs:
  postgres_data:
