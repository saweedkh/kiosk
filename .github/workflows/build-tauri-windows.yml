name: Build Tauri Windows

# Build kiosk.exe + MSI on Windows (push from Mac → download artifact).
# Manual run: Actions → Build Tauri Windows → Run workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/tauri-desktop
    paths:
      - '.github/workflows/build-tauri-windows.yml'
      - 'kiosk_desktop/**'
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'
      - 'scripts/windows/**'
  pull_request:
    branches:
      - main
      - feature/tauri-desktop
    paths:
      - '.github/workflows/build-tauri-windows.yml'
      - 'kiosk_desktop/**'
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (32-bit — required for pna.pcpos.dll / pythonnet)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'
          cache: pip
          cache-dependency-path: kiosk_backend/requirements/base.txt

      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk_frontend/package-lock.json

      - name: Set up Node.js (desktop)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk_desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kiosk_desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: kiosk_frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: kiosk_desktop
        run: npm ci

      - name: Build Django sidecar (PyInstaller onedir)
        working-directory: kiosk_backend
        shell: cmd
        env:
          DJANGO_SETTINGS_MODULE: config.settings.desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt pyinstaller
          pyinstaller --noconfirm --clean kiosk-backend.spec
          if not exist "dist\kiosk-backend\kiosk-backend.exe" (
            echo PyInstaller did not produce dist\kiosk-backend\kiosk-backend.exe
            dir dist
            if exist dist\kiosk-backend dir dist\kiosk-backend
            exit /b 1
          )
          echo Sidecar onedir OK
          dir dist\kiosk-backend

      - name: Verify sidecar onedir
        shell: pwsh
        run: |
          $exe = "kiosk_backend/dist/kiosk-backend/kiosk-backend.exe"
          $migrate = "kiosk_backend/dist/kiosk-backend/kiosk-backend-migrate.exe"
          if (-not (Test-Path $exe)) { throw "Missing onedir sidecar: $exe" }
          if (-not (Test-Path $migrate)) { throw "Missing migrate exe: $migrate" }
          Write-Host "Sidecar OK:" (Get-Item $exe).Length "bytes"
          Get-ChildItem "kiosk_backend/dist/kiosk-backend" | Select-Object -First 15 Name, Length

      - name: Build Next.js static export for Tauri
        working-directory: kiosk_frontend
        env:
          TAURI_BUILD: '1'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:18765/api
        run: npx next build

      - name: Verify frontend out/
        shell: pwsh
        run: |
          $out = "kiosk_frontend/out/index.html"
          if (-not (Test-Path $out)) {
            Write-Host "kiosk_frontend contents:"
            Get-ChildItem kiosk_frontend -Force | Format-Table Name, Mode
            throw "kiosk_frontend/out/index.html missing — static export failed"
          }
          $resolved = (Resolve-Path "kiosk_frontend/out").Path
          Write-Host "Static export OK at $resolved"
          # Tauri resolves frontendDist from src-tauri → ../../kiosk_frontend/out
          $fromTauri = "kiosk_desktop/src-tauri/../../kiosk_frontend/out/index.html"
          if (-not (Test-Path $fromTauri)) { throw "Path from src-tauri does not resolve: $fromTauri" }
          Write-Host "Tauri-relative path OK"

      - name: Build Tauri (frontend already built)
        working-directory: kiosk_desktop
        env:
          CI: 'true'
        run: npm run build:ci

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $releaseDir = "kiosk_desktop/src-tauri/target/release"
          $exe = @(
            "$releaseDir/kiosk-desktop.exe",
            "$releaseDir/kiosk.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $releaseDir -Filter *.exe | Format-Table Name, Length
            throw "No kiosk exe found in $releaseDir"
          }
          Copy-Item $exe "release/kiosk.exe"

          # onedir backend — no TEMP unpack on every boot
          $sidecarDir = "kiosk_backend/dist/kiosk-backend"
          if (-not (Test-Path "$sidecarDir/kiosk-backend.exe")) {
            throw "Sidecar onedir not found at $sidecarDir"
          }
          Copy-Item $sidecarDir "release/kiosk-backend" -Recurse -Force

          if (Test-Path "kiosk_backend/pna.pcpos.dll") {
            Copy-Item "kiosk_backend/pna.pcpos.dll" "release/"
          }
          if (Test-Path "scripts/windows/start-kiosk-startup.vbs") {
            Copy-Item "scripts/windows/start-kiosk-startup.vbs" "release/"
          }
          if (Test-Path "scripts/windows/start-kiosk.vbs") {
            Copy-Item "scripts/windows/start-kiosk.vbs" "release/"
          }
          if (Test-Path "scripts/windows/start-bale.vbs") {
            Copy-Item "scripts/windows/start-bale.vbs" "release/"
          }

          @(
            "Kiosk Windows build (fast onedir backend)",
            "========================================",
            "1. Keep ALL files in the same folder (including kiosk-backend\).",
            "2. Startup: shortcut to start-kiosk-startup.vbs only (not the EXEs).",
            "3. Backend: folder kiosk-backend\kiosk-backend.exe (no single fat EXE).",
            "4. API: http://127.0.0.1:18765/health/",
            "5. DB: %APPDATA%\com.kiosk.desktop\kiosk.db",
            "6. First install / after an update: run kiosk-backend\\kiosk-backend-migrate.exe once (no seed).",
            "7. Daily start uses kiosk-backend.exe only — no migrate/seed.",
            "8. Processes (VBS):",
            "   - kiosk-backend.exe           → API + POS DLL :18765 (fast)",
            "   - kiosk-backend.exe bale_poll → Bale bot (separate process)",
            "   - start-bale.vbs              → start Bale only (if polling is stale)",
            "   - kiosk-start.log             → next to kiosk.exe, shows what VBS launched",
            "   - kiosk-backend-migrate.exe   → migrate + permission groups (manual)",
            "",
            "Required:",
            "- kiosk.exe",
            "- kiosk-backend\  (whole folder)",
            "- start-kiosk-startup.vbs",
            "- pna.pcpos.dll (card reader)",
            "",
            "POS: PAYMENT_GATEWAY_NAME=dll. Configure in Admin > Settings > Hardware."
          ) | Set-Content -Encoding utf8 "release/README.txt"

          Get-ChildItem release | Format-Table Name, Length
          Get-ChildItem release/kiosk-backend -ErrorAction SilentlyContinue | Select-Object -First 8 Name | Format-Table

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-tauri-windows-${{ github.sha }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
