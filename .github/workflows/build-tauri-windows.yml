name: Build Tauri Windows

# Build kiosk.exe + MSI on Windows (push from Mac → download artifact).
# Manual run: Actions → Build Tauri Windows → Run workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/tauri-desktop
    paths:
      - '.github/workflows/build-tauri-windows.yml'
      - 'kiosk_desktop/**'
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'
      - 'scripts/windows/**'
  pull_request:
    branches:
      - main
      - feature/tauri-desktop
    paths:
      - '.github/workflows/build-tauri-windows.yml'
      - 'kiosk_desktop/**'
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (32-bit — required for pna.pcpos.dll / pythonnet)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'
          cache: pip
          cache-dependency-path: kiosk_backend/requirements/base.txt

      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk_frontend/package-lock.json

      - name: Set up Node.js (desktop)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk_desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kiosk_desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: kiosk_frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: kiosk_desktop
        run: npm ci

      - name: Build Django sidecar (PyInstaller)
        working-directory: kiosk_backend
        shell: cmd
        env:
          DJANGO_SETTINGS_MODULE: config.settings.desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt pyinstaller
          pyinstaller --noconfirm --clean kiosk-backend.spec
          if not exist "..\kiosk_desktop\src-tauri\binaries" mkdir "..\kiosk_desktop\src-tauri\binaries"
          if not exist "dist\kiosk-backend.exe" (
            echo PyInstaller did not produce dist\kiosk-backend.exe
            dir dist
            exit /b 1
          )
          copy /Y "dist\kiosk-backend.exe" "..\kiosk_desktop\src-tauri\binaries\kiosk-backend-x86_64-pc-windows-msvc.exe"

      - name: Verify sidecar binary
        shell: pwsh
        run: |
          $sidecar = "kiosk_desktop/src-tauri/binaries/kiosk-backend-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) { throw "Missing sidecar: $sidecar" }
          Write-Host "Sidecar OK:" (Get-Item $sidecar).Length "bytes"

      - name: Build Next.js static export for Tauri
        working-directory: kiosk_frontend
        env:
          TAURI_BUILD: '1'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
        run: npx next build

      - name: Verify frontend out/
        shell: pwsh
        run: |
          $out = "kiosk_frontend/out/index.html"
          if (-not (Test-Path $out)) {
            Write-Host "kiosk_frontend contents:"
            Get-ChildItem kiosk_frontend -Force | Format-Table Name, Mode
            throw "kiosk_frontend/out/index.html missing — static export failed"
          }
          $resolved = (Resolve-Path "kiosk_frontend/out").Path
          Write-Host "Static export OK at $resolved"
          # Tauri resolves frontendDist from src-tauri → ../../kiosk_frontend/out
          $fromTauri = "kiosk_desktop/src-tauri/../../kiosk_frontend/out/index.html"
          if (-not (Test-Path $fromTauri)) { throw "Path from src-tauri does not resolve: $fromTauri" }
          Write-Host "Tauri-relative path OK"

      - name: Build Tauri (frontend already built)
        working-directory: kiosk_desktop
        env:
          CI: 'true'
        run: npm run build:ci

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $releaseDir = "kiosk_desktop/src-tauri/target/release"
          $exe = @(
            "$releaseDir/kiosk-desktop.exe",
            "$releaseDir/kiosk.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem $releaseDir -Filter *.exe | Format-Table Name, Length
            throw "No kiosk exe found in $releaseDir"
          }
          Copy-Item $exe "release/kiosk.exe"

          # Tauri expects this exact sidecar filename beside the app
          $sidecarName = "kiosk-backend-x86_64-pc-windows-msvc.exe"
          $sidecarSrc = @(
            "$releaseDir/$sidecarName",
            "kiosk_desktop/src-tauri/binaries/$sidecarName",
            "$releaseDir/kiosk-backend.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sidecarSrc) { throw "Sidecar binary not found for packaging" }
          Copy-Item $sidecarSrc "release/$sidecarName"

          if (Test-Path "kiosk_backend/pna.pcpos.dll") {
            Copy-Item "kiosk_backend/pna.pcpos.dll" "release/"
          }

            @(
            "Kiosk Windows build",
            "===================",
            "1. Keep ALL files in the same folder.",
            "2. Run kiosk.exe (not the backend alone).",
            "3. First screen is a loading page (boot) while Django starts.",
            "4. First start may take 1-2 minutes (database migrate).",
            "5. Logs are written to the logs\\ folder next to kiosk.exe",
            "   (kiosk.log, django.log, django-app.log).",
            "",
            "Required (same folder):",
            "- kiosk.exe",
            "- kiosk-backend-x86_64-pc-windows-msvc.exe (32-bit Python sidecar for POS DLL)",
            "- pna.pcpos.dll (official PNA card reader — PE32)",
            "",
            "POS: in-process DLL (PAYMENT_GATEWAY_NAME=dll). No PosBridge, no raw TCP.",
            "Configure POS/printer IP in Admin → Settings → Hardware.",
          ) | Set-Content -Encoding utf8 "release/README.txt"

          Get-ChildItem release | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-tauri-windows-${{ github.sha }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
