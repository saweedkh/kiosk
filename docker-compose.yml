services:
  backend:
    build:
      context: ./kiosk_backend
      dockerfile: Dockerfile
    container_name: kiosk_backend
    env_file:
      - ./.env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DJANGO_SETTINGS_MODULE=config.settings
      - SQLITE_DATA_DIR=/app/data
    volumes:
      # Mount کد برای development - تغییرات فوری اعمال می‌شود
      # مهم: این باید اول باشد تا media/data بعد از آن mount شود
      - ./kiosk_backend:/app
      # Media و DB روی volume جدا (بعد از bind mount تا مسیر فایل را نپوشاند)
      - backend_media:/app/media
      - backend_db:/app/data
      - ./.env:/app/.env:ro
    networks:
      - kiosk_network
    ports:
      - "8000:8000"
    # برای دسترسی به POS و Printer در شبکه محلی
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./kiosk_frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api
    container_name: kiosk_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api
    networks:
      - kiosk_network
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kiosk_nginx
    ports:
      - "80:80"
    networks:
      - kiosk_network
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

networks:
  kiosk_network:
    driver: bridge

volumes:
  backend_media:
  backend_db:

