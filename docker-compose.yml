services:
  db:
    image: postgres:18-alpine
    container_name: kiosk_db
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kiosk}
      POSTGRES_USER: ${POSTGRES_USER:-kiosk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kiosk}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - kiosk_network
    # Optional local tooling access (pgAdmin, DBeaver). Not required by the app.
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./kiosk_backend
      dockerfile: Dockerfile
    container_name: kiosk_backend
    env_file:
      - ./.env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./kiosk_backend:/app
      - backend_media:/app/media
      - ./.env:/app/.env:ro
    networks:
      - kiosk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./kiosk_frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api
    container_name: kiosk_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api
      # Server-side metadata/SSR must reach Django directly (relative /api fails inside the container)
      - INTERNAL_API_BASE_URL=http://backend:8000/api
    networks:
      - kiosk_network
    restart: unless-stopped
    depends_on:
      - backend

  bale_bot:
    build:
      context: ./kiosk_backend
      dockerfile: Dockerfile
    container_name: kiosk_bale_bot
    env_file:
      - ./.env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    # Migrate only in backend entrypoint to avoid lock races
    command: python manage.py bale_poll
    volumes:
      - ./kiosk_backend:/app
      - backend_media:/app/media
      - ./.env:/app/.env:ro
    networks:
      - kiosk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Exit 0 when BALE_BOT_ENABLED=False — do not restart-loop
    restart: on-failure

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kiosk_nginx
    ports:
      - "80:80"
    networks:
      - kiosk_network
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

networks:
  kiosk_network:
    driver: bridge

volumes:
  backend_media:
  postgres_data:
