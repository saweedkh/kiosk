name: Build Tauri Windows

# Build kiosk.exe + MSI on Windows (push from Mac → download artifact).
# Manual run: Actions → Build Tauri Windows → Run workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/tauri-desktop
    paths:
      - '.github/workflows/build-tauri-windows.yml'
      - 'kiosk_desktop/**'
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'
      - 'scripts/windows/**'
  pull_request:
    branches:
      - main
      - feature/tauri-desktop
    paths:
      - '.github/workflows/build-tauri-windows.yml'
      - 'kiosk_desktop/**'
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kiosk_backend/requirements/base.txt

      - name: Set up Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk_frontend/package-lock.json

      - name: Set up Node.js (desktop)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kiosk_desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kiosk_desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: kiosk_frontend
        run: npm ci

      - name: Install desktop dependencies
        working-directory: kiosk_desktop
        run: npm ci

      - name: Build Django sidecar (PyInstaller)
        working-directory: kiosk_backend
        shell: cmd
        env:
          DJANGO_SETTINGS_MODULE: config.settings.desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt pyinstaller
          pyinstaller --noconfirm --clean kiosk-backend.spec
          if not exist "..\kiosk_desktop\src-tauri\binaries" mkdir "..\kiosk_desktop\src-tauri\binaries"
          copy /Y "dist\kiosk-backend-x86_64-pc-windows-msvc.exe" "..\kiosk_desktop\src-tauri\binaries\kiosk-backend-x86_64-pc-windows-msvc.exe"

      - name: Verify sidecar binary
        shell: pwsh
        run: |
          $sidecar = "kiosk_desktop/src-tauri/binaries/kiosk-backend-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) { throw "Missing sidecar: $sidecar" }
          Write-Host "Sidecar OK:" (Get-Item $sidecar).Length "bytes"

      - name: Build Tauri (Next static + kiosk.exe + MSI)
        working-directory: kiosk_desktop
        env:
          CI: 'true'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "kiosk_desktop/src-tauri/target/release/kiosk.exe" "release/" -ErrorAction Stop
          $msi = Get-ChildItem "kiosk_desktop/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if ($msi) { Copy-Item $msi.FullName "release/" }
          $nsis = Get-ChildItem "kiosk_desktop/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if ($nsis) { Copy-Item $nsis.FullName "release/" }
          if (Test-Path "kiosk_backend/pna.pcpos.dll") {
            Copy-Item "kiosk_backend/pna.pcpos.dll" "release/"
          }
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-tauri-windows-${{ github.sha }}
          path: release/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
