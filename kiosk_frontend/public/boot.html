<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>کیوسک — در حال راه‌اندازی</title>
    <style>
      @font-face {
        font-family: "Vazir";
        src: url("./font/Vazir.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Vazir";
        src: url("./font/Vazir-Medium.ttf") format("truetype");
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Vazir";
        src: url("./font/Vazir-Bold.ttf") format("truetype");
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Vazir";
        src: url("./font/Vazir-Black.ttf") format("truetype");
        font-weight: 900;
        font-display: swap;
      }

      :root {
        --bg: #fff3e8;
        --bg-deep: #ffe4cc;
        --primary: #e17100;
        --primary-soft: rgba(225, 113, 0, 0.14);
        --primary-glow: rgba(225, 113, 0, 0.35);
        --text: #1c1917;
        --muted: #78716c;
        --err: #b91c1c;
        --err-bg: #fef2f2;
        --err-border: #fecaca;
        --card: rgba(255, 255, 255, 0.55);
        --line: rgba(28, 25, 23, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Vazir, Tahoma, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 20px;
        position: relative;
      }

      .atmosphere {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(ellipse 70% 55% at 50% -5%, rgba(225, 113, 0, 0.22), transparent 60%),
          radial-gradient(ellipse 45% 40% at 85% 90%, rgba(225, 113, 0, 0.1), transparent 55%),
          radial-gradient(ellipse 40% 35% at 8% 75%, rgba(255, 200, 140, 0.35), transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      }

      .atmosphere::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.35;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(48px);
        opacity: 0.55;
        animation: drift 12s ease-in-out infinite alternate;
      }

      .orb-a {
        width: 280px;
        height: 280px;
        background: rgba(225, 113, 0, 0.28);
        top: 8%;
        left: 12%;
      }

      .orb-b {
        width: 220px;
        height: 220px;
        background: rgba(255, 180, 100, 0.4);
        bottom: 12%;
        right: 10%;
        animation-delay: -4s;
        animation-duration: 15s;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0) scale(1);
        }
        to {
          transform: translate(24px, -18px) scale(1.08);
        }
      }

      .stage {
        position: relative;
        z-index: 1;
        width: min(440px, 100%);
        text-align: center;
        animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .mark {
        position: relative;
        width: 88px;
        height: 88px;
        margin: 0 auto 28px;
      }

      .mark-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--primary);
        border-right-color: rgba(225, 113, 0, 0.25);
        animation: spin 1.1s linear infinite;
      }

      .mark-ring-soft {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(225, 113, 0, 0.18);
        animation: pulse-ring 2.4s ease-out infinite;
      }

      .mark-core {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background:
          linear-gradient(145deg, #ff9a3c 0%, var(--primary) 55%, #c45f00 100%);
        box-shadow:
          0 12px 28px var(--primary-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mark-core svg {
        width: 28px;
        height: 28px;
        color: #fff;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.92);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.18);
          opacity: 0;
        }
      }

      .brand {
        margin: 0;
        font-size: clamp(2.35rem, 7vw, 3rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1;
        background: linear-gradient(120deg, #c45f00 0%, var(--primary) 45%, #ff9a3c 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .eyebrow {
        margin: 14px 0 0;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .panel {
        margin-top: 36px;
        padding: 28px 24px 24px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.8) inset,
          0 24px 48px rgba(120, 60, 0, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      #status {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 400;
        line-height: 1.75;
        min-height: 3.4em;
        white-space: pre-line;
      }

      .track {
        margin-top: 22px;
        height: 4px;
        border-radius: 999px;
        background: rgba(225, 113, 0, 0.12);
        overflow: hidden;
      }

      .bar {
        height: 100%;
        width: 28%;
        border-radius: inherit;
        background: linear-gradient(90deg, #c45f00, var(--primary), #ffb45c);
        box-shadow: 0 0 12px var(--primary-glow);
        animation: indeterminate 1.6s ease-in-out infinite;
        transform-origin: right center;
      }

      .bar.done {
        width: 100% !important;
        animation: none;
        transition: width 0.45s ease;
      }

      @keyframes indeterminate {
        0% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(-350%);
        }
      }

      .meta {
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
        margin-inline-end: 6px;
        vertical-align: middle;
        animation: blink 1.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      #elapsed {
        font-variant-numeric: tabular-nums;
        direction: ltr;
        unicode-bidi: isolate;
      }

      #error {
        display: none;
        margin-top: 18px;
        padding: 16px 16px 14px;
        border-radius: 16px;
        background: var(--err-bg);
        border: 1px solid var(--err-border);
        color: var(--err);
        text-align: right;
        font-size: 0.88rem;
        line-height: 1.75;
        white-space: pre-wrap;
      }

      #error.visible {
        display: block;
        animation: rise-in 0.35s ease both;
      }

      .actions {
        margin-top: 18px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 14px;
        background: linear-gradient(145deg, #ff8a1a, var(--primary) 55%, #c45f00);
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 700;
        padding: 12px 28px;
        cursor: pointer;
        box-shadow: 0 10px 24px var(--primary-glow);
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      button:hover {
        filter: brightness(1.06);
      }

      button:active {
        transform: scale(0.98);
      }

      .hidden {
        display: none !important;
      }

      body.is-error .mark-ring,
      body.is-error .mark-ring-soft,
      body.is-error .bar,
      body.is-error .dot {
        animation: none;
      }

      body.is-error .mark-core {
        background: linear-gradient(145deg, #ef4444, #b91c1c);
        box-shadow: 0 12px 28px rgba(185, 28, 28, 0.28);
      }

      body.is-ready .mark-ring,
      body.is-ready .mark-ring-soft {
        animation: none;
        opacity: 0;
      }

      body.is-ready .mark-core {
        background: linear-gradient(145deg, #34d399, #059669);
        box-shadow: 0 12px 28px rgba(5, 150, 105, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
    </div>

    <div class="stage">
      <div class="mark" aria-hidden="true">
        <div class="mark-ring-soft"></div>
        <div class="mark-ring"></div>
        <div class="mark-core" id="markCore">
          <svg id="markIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M4 7.5h16v2.2H4V7.5zm2.2-4h2.2v4.4H6.2V3.5zm4.4 0h2.2v4.4h-2.2V3.5zm4.4 0h2.2v4.4h-2.2V3.5zM7.5 14h9v1.2a3.3 3.3 0 01-3.3 3.3h-2.4A3.3 3.3 0 017.5 15.2V14z"
              fill="currentColor"
            />
          </svg>
        </div>
      </div>

      <p class="brand">کیوسک</p>
      <p class="eyebrow">SELF SERVICE</p>

      <div class="panel">
        <h1 id="title">در حال راه‌اندازی…</h1>
        <p id="status">لطفاً صبر کنید. اولین اجرا ممکن است ۱ تا ۲ دقیقه طول بکشد.</p>

        <div class="track" id="track">
          <div class="bar" id="bar"></div>
        </div>

        <div class="meta" id="meta">
          <span><span class="dot"></span>در حال آماده‌سازی سرویس</span>
          <span id="elapsed">۰ ثانیه</span>
        </div>

        <div id="error" role="alert"></div>
        <div class="actions">
          <button id="retry" class="hidden" type="button">تلاش دوباره</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var HEALTH = "http://127.0.0.1:18765/health/";
        // Slow probes — rapid /health/ floods starve PyInstaller unpack + Django boot.
        var INTERVAL_MS = 5000;
        var started = Date.now();
        var timer = null;
        var inFlight = false;
        var done = false;

        var statusEl = document.getElementById("status");
        var titleEl = document.getElementById("title");
        var errorEl = document.getElementById("error");
        var retryBtn = document.getElementById("retry");
        var elapsedEl = document.getElementById("elapsed");
        var barEl = document.getElementById("bar");
        var markIcon = document.getElementById("markIcon");

        var messages = [
          "در انتظار بک‌اند…",
          "بک‌اند در حال آماده‌سازی است — لطفاً صبر کنید…",
          "هنوز صبر کنید؛ اولین اجرا ممکن است طول بکشد…",
        ];

        var ICON_OK =
          '<path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';

        function toFaDigits(n) {
          return String(n).replace(/\d/g, function (d) {
            return "۰۱۲۳۴۵۶۷۸۹"[d];
          });
        }

        function elapsedLabel() {
          var s = Math.floor((Date.now() - started) / 1000);
          return toFaDigits(s) + " ثانیه";
        }

        function setBusy() {
          var idx = Math.min(
            messages.length - 1,
            Math.floor((Date.now() - started) / 15000)
          );
          statusEl.textContent = messages[idx];
          elapsedEl.textContent = elapsedLabel();
        }

        function goApp() {
          if (done) return;
          done = true;
          if (timer) clearInterval(timer);
          document.body.classList.add("is-ready");
          document.body.classList.remove("is-error");
          barEl.classList.add("done");
          titleEl.textContent = "آماده شد";
          statusEl.textContent = "در حال باز کردن صفحه…";
          elapsedEl.textContent = elapsedLabel();
          markIcon.innerHTML = ICON_OK;
          setTimeout(function () {
            location.replace("index.html");
          }, 420);
        }

        function tick() {
          if (done || inFlight) return;
          setBusy();
          inFlight = true;
          fetch(HEALTH, { cache: "no-store" })
            .then(function (r) {
              if (r.ok) goApp();
            })
            .catch(function () {})
            .then(function () {
              inFlight = false;
            });
        }

        retryBtn.classList.add("hidden");
        errorEl.classList.remove("visible");
        setBusy();
        // Give backend a few seconds to unpack before the first probe.
        setTimeout(function () {
          tick();
          timer = setInterval(tick, INTERVAL_MS);
        }, 4000);
      })();
    </script>
  </body>
</html>
