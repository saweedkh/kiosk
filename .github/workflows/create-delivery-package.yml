name: Create Delivery Package

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'kiosk_backend/**'
      - 'kiosk_frontend/**'
      - 'nginx/**'
      - 'docker-compose.production.yml'
      - 'docker-compose.production.host-network.yml'
      - '.env.example'
      - 'run.bat'
      - 'create-delivery-package.sh'
  release:
    types: [created]

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and package
      run: |
        chmod +x create-delivery-package.sh build-images.sh
        ./create-delivery-package.sh

    - name: Upload delivery package artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiosk-delivery-package
        path: kiosk-app.zip
        retention-days: 90

    - name: Create Release (if tag)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: kiosk-app.zip
        body: |
          پکیج تحویلی کیوسک آماده است.

          شامل:
          - Docker Images (backend, frontend, nginx) + Postgres از Hub
          - run/stop/setup-startup
          - backup/restore + مهاجرت SQLite→Postgres
          - `.env` کامل (حتماً SECRET_KEY و POSTGRES_PASSWORD را عوض کنید)
          - OPERATIONS.md و سایر مستندات

          راهنما: README.txt و PACKAGE_CONTENTS.md و OPERATIONS.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
